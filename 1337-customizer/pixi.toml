[workspace]
name = "1337-customizer"
version = "1.0.0"
description = "Wallpapers, looks, widgets and motion for Linux"
authors = ["1337-Customizer contributors"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Python packages are managed with Pixi.  Use `pixi add <package>` or
# `pixi add --pypi <package>`; do not pip-install into this environment.
[dependencies]
python = "3.12.*"
pygobject = ">=3.50,<4"
gtk4 = ">=4.14"
libadwaita = ">=1.6"
gdk-pixbuf = ">=2.42"
gsettings-desktop-schemas = "*"
adwaita-icon-theme = "*"
pillow = ">=10.0"
pycairo = ">=1.26"
gtk4-layer-shell = ">=1.0"
flake8 = ">=7"

[tasks]
run = "python -m leet_customizer"
doctor = "python -m leet_customizer doctor"
test = "python -m unittest discover -s tests -v"
compile = "python -m compileall -q leet_customizer"
lint = "python -m flake8 leet_customizer --select=F821,F811,E9 --max-line-length=120"
build-run = "bash packaging/build-run.sh"

[activation]
scripts = ["scripts/activate.sh"]
