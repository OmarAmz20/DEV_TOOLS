[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "aura-core"
version = "0.1.0"
description = "Rust colour and palette engine for Aura Studio"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "crates/aura-py/Cargo.toml"
module-name = "aura_core"
