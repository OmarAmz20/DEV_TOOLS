[package]
name = "aura-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Colour maths, palette extraction and theme generation for Aura Studio"

[dependencies]
image = { version = "0.25", default-features = false, features = [
    "bmp", "gif", "jpeg", "png", "tiff", "webp",
] }
serde = { version = "1", features = ["derive"] }
