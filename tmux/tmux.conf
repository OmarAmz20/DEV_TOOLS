# ============================================
# PREFIX
# ============================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ============================================
# TERMINAL
# ============================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -sg escape-time 10
set -g mouse on

# ============================================
# INDEXING
# ============================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ============================================
# SPLITS
# ============================================
bind | split-window -h
bind - split-window -v

# ============================================
# PANE NAVIGATION (prefix + h/j/k/l)
# ============================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# WINDOWS
# ============================================
bind -r Tab next-window
bind -r BTab previous-window

bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded!"

# ============================================
# COPY MODE (vi)
# ============================================
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel clip"
bind Enter copy-mode

# ============================================
# SENSIBLE DEFAULTS (replaces tmux-sensible)
# ============================================
set -g set-titles on
setw -g alternate-screen on
set -g display-time 3000
set -g display-panes-time 4000
set -g status-keys vi
setw -g mode-keys vi

# ============================================
# STATUS BAR (manual, replaces catppuccin/tmux)
# ============================================
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-fg white
set -g status-bg default
set -g status-left "#[fg=green,bold]#S "
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M "
setw -g window-status-current-style "fg=cyan,bold"
setw -g window-status-style "fg=white"

# ============================================
# PERFORMANCE & MISC
# ============================================
set -s focus-events on
set -g history-limit 100000
setw -g aggressive-resize on
setw -g automatic-rename on
bind y setw synchronize-panes
